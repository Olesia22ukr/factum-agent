<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Factum Auto — агент з підбору авто</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --asphalt: #15171b;
    --panel: #1c1f26;
    --panel-2: #22262f;
    --line: #2c313c;
    --amber: #e8a33d;
    --amber-dim: #6b5326;
    --text: #eceef1;
    --text-dim: #9aa1ad;
    --danger: #d9614f;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--asphalt);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .shell {
    width: 100%;
    max-width: 760px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    background: var(--panel);
  }

  header {
    padding: 18px 22px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 14px;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
  }

  .lot-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--amber);
    border: 1px solid var(--amber-dim);
    padding: 3px 8px;
    border-radius: 3px;
    letter-spacing: 0.06em;
    white-space: nowrap;
  }

  .titles h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .titles p {
    margin: 2px 0 0;
    font-size: 12.5px;
    color: var(--text-dim);
  }

  .status-dot {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
  }

  .status-dot span.dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #4caf70;
    box-shadow: 0 0 6px #4caf70;
  }

  .thread {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg {
    max-width: 84%;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .msg.agent {
    align-self: flex-start;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-top-left-radius: 3px;
  }

  .msg.user {
    align-self: flex-end;
    background: var(--amber-dim);
    border: 1px solid var(--amber);
    color: #fff3e0;
    border-top-right-radius: 3px;
  }

  .msg.system {
    align-self: center;
    background: transparent;
    border: 1px dashed var(--line);
    color: var(--text-dim);
    font-size: 12.5px;
    font-family: 'JetBrains Mono', monospace;
    max-width: 90%;
    text-align: center;
  }

  .msg.error {
    align-self: center;
    color: var(--danger);
    border: 1px solid var(--danger);
    background: rgba(217, 97, 79, 0.08);
    font-size: 13px;
    max-width: 90%;
  }

  .typing {
    align-self: flex-start;
    display: flex;
    gap: 4px;
    padding: 12px 14px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    border-top-left-radius: 3px;
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--amber);
    opacity: 0.35;
    animation: pulse 1.1s infinite ease-in-out;
  }

  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-2px); }
  }

  form {
    display: flex;
    gap: 10px;
    padding: 16px 18px;
    border-top: 1px solid var(--line);
    background: var(--panel-2);
  }

  textarea {
    flex: 1;
    resize: none;
    background: var(--asphalt);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 11px 13px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    line-height: 1.4;
    max-height: 120px;
  }

  textarea:focus {
    outline: none;
    border-color: var(--amber);
  }

  button.send {
    background: var(--amber);
    border: none;
    color: #1a1300;
    font-weight: 600;
    font-family: 'Space Grotesk', sans-serif;
    padding: 0 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: filter 0.15s ease;
  }

  button.send:hover { filter: brightness(1.08); }
  button.send:disabled { opacity: 0.5; cursor: not-allowed; }

  .hint {
    padding: 0 18px 14px;
    font-size: 11.5px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    background: var(--panel-2);
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body>

<div class="shell">
  <header>
    <div class="lot-tag">LOT · AI</div>
    <div class="titles">
      <h1>Factum Auto Agent</h1>
      <p>Пошук та оцінка ризику авто з аукціону</p>
    </div>
    <div class="status-dot"><span class="dot"></span>online</div>
  </header>

  <div class="thread" id="thread">
    <div class="msg system">Опишіть, яке авто шукаєте — марку, рік, бюджет, максимальний пробіг. Агент сам знайде варіанти та оцінить ризики.</div>
  </div>

  <form id="chat-form">
    <textarea id="input" rows="1" placeholder="Напр.: знайди Toyota Corolla від 2022 року до 10000$ і до 50000 миль" required></textarea>
    <button class="send" type="submit">Надіслати</button>
  </form>
  <div class="hint">Поточна ставка на аукціоні ≠ фінальна вартість авто.</div>
</div>

<script>
  const API_URL = "/api/chat";
  const thread = document.getElementById("thread");
  const form = document.getElementById("chat-form");
  const input = document.getElementById("input");
  const sendBtn = form.querySelector("button.send");

  let sessionId = localStorage.getItem("factum_session_id") || null;

  function addMessage(text, cls) {
    const el = document.createElement("div");
    el.className = "msg " + cls;
    el.textContent = text;
    thread.appendChild(el);
    thread.scrollTop = thread.scrollHeight;
    return el;
  }

  function showTyping() {
    const el = document.createElement("div");
    el.className = "typing";
    el.id = "typing-indicator";
    el.innerHTML = "<span></span><span></span><span></span>";
    thread.appendChild(el);
    thread.scrollTop = thread.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById("typing-indicator");
    if (el) el.remove();
  }

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, session_id: sessionId })
      });

      const data = await res.json();
      hideTyping();

      if (!res.ok) {
        addMessage(data.detail || "Сталася помилка. Спробуйте ще раз.", "error");
        return;
      }

      sessionId = data.session_id;
      localStorage.setItem("factum_session_id", sessionId);
      addMessage(data.reply, "agent");

    } catch (err) {
      hideTyping();
      addMessage("Не вдалося звʼязатися з сервером. Перевірте зʼєднання.", "error");
    } finally {
      sendBtn.disabled = false;
    }
  });
</script>

</body>
</html>
